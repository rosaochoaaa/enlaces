<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Enlaces de Rosa Ochoa: calendario de eventos en Caracas, WhatsApp, LinkedIn, Instagram y correo.">
<style>body{margin:0}</style>
<title>Rosa Ochoa Enlaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<style>
  /* Layout: una columna "link in bio" de vidrio fino sobre manchas de color vivas y difuminadas en movimiento.
     Estética de un solo tema (claro y cálido), elegida a propósito. */
  :root {
    --base: #fbf5ec;
    --mustard: #ffa91f;
    --butter: #ffd84d;
    --tangerine: #ff5a1f;
    --coral: #ff8a5c;
    --sand: #f3ece2;
    --ink: #1d1712;
    --muted: #82766a;
    --glass: rgba(255, 253, 249, .55);
    --glass-line: rgba(255, 255, 255, .9);
    --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--base); color: var(--ink); }
  body { font-family: var(--font); font-weight: 300; font-size: 15px; line-height: 1.5; min-height: 100vh; overflow-x: hidden; }

  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); will-change: transform; mix-blend-mode: multiply; }
  .b1 { width: 60vmax; height: 60vmax; left: 25%; top: -25%; background: var(--butter); opacity: .9; animation: m1 14s ease-in-out infinite; }
  .b2 { width: 42vmax; height: 42vmax; left: 50%; top: 5%; background: var(--mustard); opacity: .75; animation: m2 11s ease-in-out infinite; }
  .b3 { width: 50vmax; height: 50vmax; left: 30%; bottom: -25%; background: var(--tangerine); opacity: .55; animation: m3 13s ease-in-out infinite; }
  .b4 { width: 38vmax; height: 38vmax; left: -15%; top: 35%; background: var(--coral); opacity: .5; animation: m4 16s ease-in-out infinite; }
  @keyframes m1 { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(-22vw, 18vh) scale(1.15); } 66% { transform: translate(10vw, 30vh) scale(.9); } }
  @keyframes m2 { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(-35vw, 25vh) scale(.85); } 66% { transform: translate(-10vw, -12vh) scale(1.2); } }
  @keyframes m3 { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(20vw, -25vh) scale(1.2); } 66% { transform: translate(-25vw, -10vh) scale(.95); } }
  @keyframes m4 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40vw, -20vh) scale(1.25); } }

  .wrap {
    position: relative; z-index: 1;
    max-width: 420px; margin: 0 auto;
    padding-block: 48px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 26px;
  }

  .profile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
  .ring { position: relative; width: 124px; height: 124px; display: grid; place-items: center; margin-bottom: 10px; }
  .ring::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--butter), var(--mustard), var(--tangerine), var(--coral), var(--butter));
    animation: spin 6s linear infinite;
  }
  .ring::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%; z-index: -1;
    background: conic-gradient(var(--butter), var(--mustard), var(--tangerine), var(--coral), var(--butter));
    filter: blur(16px); opacity: .6; animation: spin 6s linear infinite;
  }
  .ring img {
    position: relative; width: 114px; height: 114px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--base);
  }
  @keyframes spin { to { transform: rotate(1turn); } }

  h1 { margin: 0; font-size: 30px; font-weight: 500; line-height: 1.1; letter-spacing: -.02em; }
  .role { margin: 0; color: var(--muted); font-size: 13px; max-width: 32ch; }
  .loc {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 6px;
    font-size: 12px; font-weight: 400;
    background: var(--glass); border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    padding: 4px 13px; border-radius: 999px;
  }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .link {
    display: grid; grid-template-columns: auto minmax(0, 1fr) 30px; align-items: center; gap: 14px;
    padding: 10px 12px 10px 10px;
    color: var(--ink); text-decoration: none;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 24px;
    -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
    box-shadow: 0 6px 22px rgba(160, 90, 20, .08);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .link:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255, 90, 31, .16); }
  .link:focus-visible { outline: 1.5px solid var(--tangerine); outline-offset: 3px; }
  .ico { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
  .ico svg { width: 19px; height: 19px; }
  .txt { min-width: 0; }
  .txt b { display: block; font-weight: 500; font-size: 15px; line-height: 1.3; }
  .txt span { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .go { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; transition: transform .25s ease, background .25s ease; }
  .go svg { width: 14px; height: 14px; }
  .link:hover .go { transform: translateX(2px); background: var(--tangerine); }

  .link.featured { padding: 14px 14px 14px 12px; border-radius: 28px; background: rgba(255, 250, 240, .72); border-color: rgba(255, 169, 31, .7); box-shadow: 0 10px 34px rgba(255, 90, 31, .2); }
  .link.featured .ico { width: 50px; height: 50px; }
  .link.featured .txt b { font-size: 17px; }
  .link.featured .txt span { white-space: normal; }
  .link.featured .go { background: linear-gradient(135deg, var(--mustard), var(--tangerine)); }
  .featured-label { font-size: 10.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--tangerine); margin: 0 0 -2px 8px; }
  .ico { background: rgba(255, 255, 255, .5); border: 1px solid rgba(29, 23, 18, .1); }
  .link.featured .ico { background: transparent; border-color: rgba(255, 90, 31, .45); color: var(--tangerine); }

  .mail {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px;
    font-size: 13px; color: var(--muted);
  }
  .mail code { font-family: var(--font); color: var(--ink); font-weight: 400; user-select: all; }
  .copy {
    font: 400 12px var(--font); color: var(--ink); cursor: pointer;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 5px 14px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .copy:hover { background: #fff; }
  .copy:focus-visible { outline: 1.5px solid var(--tangerine); outline-offset: 2px; }

  footer { text-align: center; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }


  @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -4px; } }
  .link { animation: bob 4s ease-in-out infinite; }
  li:nth-child(3) .link { animation-delay: -.8s; }
  li:nth-child(4) .link { animation-delay: -1.6s; }
  li:nth-child(5) .link { animation-delay: -2.4s; }
  .link.featured { animation-duration: 3.4s; }
  .go { animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { translate: 0 0; } 50% { translate: 3px 0; } }
  @media (prefers-reduced-motion: reduce) {
    .b1, .b2, .b3, .b4 { animation-duration: 40s; }
    .ring::before, .ring::after { animation: none; }
    .link, .go { transition: none; animation: none; }
  }
</style>
